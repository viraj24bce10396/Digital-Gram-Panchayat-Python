{% extends "base.html" %}

{% block title %}Services{% endblock %}

{% block content %}
<h2 class="mb-4">Citizen Services</h2>
<div class="row g-4">
    {% for service in services %}
    <div class="col-md-4">
        <div class="card service-card h-100">
            <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-{{ service.icon }} fs-3 text-success"></i>
                    <h5 class="mb-0 ms-2">{{ service.name }}</h5>
                </div>
                <p>{{ service.description }}</p>
                <div class="d-flex justify-content-between text-muted small mb-3">
                    <span>Processing: {{ service.processing_days }} days</span>
                    <span>Fee: ₹{{ service.fee }}</span>
                </div>
                <a href="{{ url_for('service_detail', service_id=service.id) }}" class="btn btn-success w-100">Apply Now</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
